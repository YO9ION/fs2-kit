###############################################################################

# OPTIONAL: Proximity Notice radius alerts
#
# Watches decoded TETRA LIP SDS positions. When an allowed device enters the
# configured radius around FS2, alarms can be forwarded through the
# existing SDS, Snom/SIP and Telegram paths.
# Empty whitelists mean "all"; blacklists always win.
#
# The meshcom_* fields and trigger_meshcom below are accepted by the parser but
# inert in this build: FS2 does not ship a MeshCom source, so positions
# come from TETRA LIP only. Leave the MeshCom toggles at their defaults.
#
[proximity_notice]
enabled = false
flowstation_lat = @@LAT@@
flowstation_lon = @@LON@@
radius_m = 300000.0
cooldown_secs = 1800

trigger_tetra = true
trigger_meshcom = true

forward_sds = true
forward_sip = false
forward_telegram = false

tetra_issi_whitelist = []
tetra_issi_blacklist = []
meshcom_source_whitelist = []
meshcom_source_blacklist = []

sds_source_issi = 9999
sds_dest_issi = 1
sds_dest_is_group = true

text_prefix = "Proximity Notice"

sip_title_prefix = "Proximity Notice"
telegram_prefix = "Proximity Notice"
# Third Brew connection (private group routing): DISABLED. Needs your own server.
# [brew_private]
# host = "your.server.address"
# port = xxxx
# tls = false
