# FS2 configuration, generated by fs2-setup from this template.
# You are responsible for complying with the radio regulations of your country.
# Everything else (Telegram alerts, network links, weather, announcements...) can be
# configured later from the dashboard Config page.

config_version = "0.6"
stack_mode = "Bs"
service_name = "fs2"

[phy_io]
backend = "SoapySdr"

[phy_io.soapysdr]
tx_freq = @@TX_HZ@@
rx_freq = @@RX_HZ@@
@@SDR_LINES@@

[net_info]
mcc = @@MCC@@
mnc = @@MNC@@

[cell_info]
freq_band = @@FREQ_BAND@@
main_carrier = @@MAIN_CARRIER@@
duplex_spacing = 4
freq_offset = 0
reverse_operation = false
location_area = @@LA@@
colour_code = @@CC@@
timezone = "@@TZ@@"
local_ssi_ranges = [
    [0, 90],
]
system_wide_services = true
voice_service = true

[dashboard]
port = 8080
bind = "0.0.0.0"
username = "@@DASH_USER@@"
password = "@@DASH_PASS@@"
